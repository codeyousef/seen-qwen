manifest-version = 1

[project]
name = "seen_qwen"
version = "0.15.0-dev"
language = "en"
visibility = "private"
edition = "2025"
modules = [
    "src/formats/sqw.seen",
    "src/formats/sqw_reader.seen",
    "src/formats/sqw_writer.seen",
    "src/converter/conversion_plan.seen",
    "src/converter/shard_stream.seen",
    "src/converter/conversion_evidence.seen",
    "src/converter/conversion_finalizer.seen",
    "src/model/config.seen",
    "src/model/tensor_catalog.seen",
    "src/model/contract_geometry.seen",
    "src/model/cpu_reference.seen",
    "src/model/cpu_attention.seen",
    "src/model/cpu_gdn.seen",
    "src/model/cpu_head.seen",
    "src/model/cpu_engine.seen",
    "src/quant/calibration.seen",
    "src/quant/reference_codec.seen",
    "src/tokenizer/tokenizer.seen",
]

[build]
targets = ["native"]
optimize = "speed"
profile = "release"

